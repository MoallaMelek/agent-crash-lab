name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check (mypy --strict on src/)
        run: uv run mypy
      - name: Tests (unit + subprocess integration) with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage combine
          uv run coverage report --fail-under=85
      - name: Doctor
        run: uv run crashlab doctor
      - name: Curated crash matrix, checked against expected verdicts
        # Fails if any observed verdict differs from the curated expectation, a cell is not
        # reproducible across the repeats, or the lab itself errors. ~1-2 minutes on a runner.
        run: uv run crashlab matrix --check -j 4 --repeat 2 --out matrix-out -q
      - name: Keep the matrix evidence of this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-${{ matrix.os }}-py${{ matrix.python }}
          path: matrix-out/
          if-no-files-found: ignore
          retention-days: 14
