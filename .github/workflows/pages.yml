name: Evidence viewer (GitHub Pages)

# Builds the static viewer from the committed evidence file. It renders recorded results only;
# nothing in this workflow runs the crash matrix.
on:
  push:
    branches: [main]
    paths:
      - docs/evidence/latest/results.json
      - src/crashlab/viewer/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Build viewer from committed evidence
        run: |
          uv run crashlab report docs/evidence/latest/results.json --out site
          cp docs/evidence/latest/results.json docs/evidence/latest/summary.md site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
